data:
  batch_size: 64
  shuffle: True
  num_workers: 2
  context_len: 256
  labelintext: False
training:
  num_epochs: 10
  lr: 0.0005
  weight_decay:  0.0005
  min_lr: 0.0005
model:
  model_dir: "saved_models/classifier"
  name: "GPT2"
freezer:
  transformer: 1.
  embeddings: True
  pos: True
  lm_head: True
  ln_f: True
seed: 42